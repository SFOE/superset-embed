# Generated with AI assistance - Kiro [2025-05]
# .github/dependabot.yml
# Dependabot configuration for automated dependency vulnerability scanning.
# Documentation: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions (if used)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

# Note: Dependabot does not natively support R (CRAN) packages.
# For R dependency scanning, consider using the 'oysteR' package locally:
# https://github.com/sonatype-nexus-community/oysteR
